stages:
  - prepare
  - build
  - release

variables:
  PACKAGE_NAME: "sACN-Monitor"
  DOCKER_VERSION: "27.3.1"
  # Prevent Node OOM during frontend build
  NODE_OPTIONS: "--max-old-space-size=4096"
  WAILS_CROSS_IMAGE: "${CI_REGISTRY_IMAGE}/wails-cross:latest"
  CI_BUILD_IMAGE: "${CI_REGISTRY_IMAGE}/builder:latest"


build-wails-cross-image:
  stage: prepare
  tags:
    - shell
    - linux
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    # Pull existing image to prime layer cache (no-op if absent)
    - docker pull ${WAILS_CROSS_IMAGE} || true
    - docker build --cache-from ${WAILS_CROSS_IMAGE} -t ${WAILS_CROSS_IMAGE} -f build/docker/Dockerfile.cross .
    - docker push ${WAILS_CROSS_IMAGE}

build-ci-image:
  stage: prepare
  tags:
    - shell
    - linux
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker pull ${CI_BUILD_IMAGE} || true
    - docker build --cache-from ${CI_BUILD_IMAGE} --build-arg DOCKER_VERSION=${DOCKER_VERSION} -t ${CI_BUILD_IMAGE} -f build/docker/Dockerfile.ci .
    - docker push ${CI_BUILD_IMAGE}



build:
  stage: build
  image: ${CI_BUILD_IMAGE}
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: 1
  tags:
    - docker-builder
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build-ci-image
      artifacts: false
    - job: build-wails-cross-image
      artifacts: false
  before_script:
    # Ensure the wails-cross image is available in the Docker daemon
    # for wails3 build's internal docker usage.
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker pull ${WAILS_CROSS_IMAGE} || true
    - docker tag ${WAILS_CROSS_IMAGE} wails-cross
  script:
    - wails3 doctor
    - wails3 task release:all VERSION="${CI_COMMIT_TAG#v}"
  artifacts:
    paths:
      - dist/
    expire_in: 1 day



upload:
  stage: release
  image: alpine:3.24.0
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build
      artifacts: true
  before_script:
    - apk add --no-cache curl
  script:
    - |
      for archive in dist/*.tar.gz; do
        [ -f "$archive" ] || continue
        filename=$(basename "$archive")
        echo "  -> ${filename}"
        curl --fail --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${archive}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sacn-monitor/${CI_COMMIT_TAG}/${filename}"
      done


release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build
      artifacts: true
    - job: upload
      artifacts: false
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git jq
  script:
    # --- Generate changelog from commits since previous tag ---
    - |
      prev_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
      if [ -n "$prev_tag" ]; then
        git log --pretty=format:"- %s" "${prev_tag}"..HEAD > release-description.txt
      else
        echo "Release ${CI_COMMIT_TAG}" > release-description.txt
      fi
    # --- Build release-cli --assets-link flags for platform archives ---
    - |
      : > release-links.txt
      for archive in dist/*.tar.gz; do
        [ -f "$archive" ] || continue
        filename=$(basename "$archive")
        url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${CI_COMMIT_TAG}/${filename}"
        name_json=$(echo "$filename" | jq -Rs . | sed 's/^"//;s/"$//')
        url_json=$(echo "$url" | jq -Rs . | sed 's/^"//;s/"$//')
        echo "--assets-link={\"name\":\"${name_json}\",\"url\":\"${url_json}\"}" >> release-links.txt
      done
    # --- Create the GitLab release using release-cli ---
    - |
      echo "Creating GitLab release ${CI_COMMIT_TAG}..."
      set --
      while IFS= read -r line; do
        set -- "$@" "$line"
      done < release-links.txt
      release-cli create \
        --name="sACN Monitor ${CI_COMMIT_TAG}" \
        --tag-name="${CI_COMMIT_TAG}" \
        --description="$(cat release-description.txt)" \
        "$@"



pages:
  stage: release
  image:
    name: floryn90/hugo:0.123.8-ext-alpine
    entrypoint: [""]
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest-11 --activate
    - cd ./docs && pnpm install --frozen-lockfile
  script:
    - hugo
  artifacts:
    paths:
      - public
