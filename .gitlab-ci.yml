stages:
  - build
  - release

variables:
  PACKAGE_NAME: "sACN-Monitor"
  # Prevent Node OOM during frontend build
  NODE_OPTIONS: "--max-old-space-size=4096"


.build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - task setup
  artifacts:
    paths:
      - dist/
    expire_in: 1 day

.build-linux:
  extends: .build
  before_script:
    - export PATH="$HOME/.local/bin:$HOME/go/bin:$PATH"
    - task setup

.build-windows:
  extends: .build
  before_script:
    - '$env:Path = "C:\Program Files (x86)\NSIS;C:\Program Files\Git\usr\bin;$env:Path"'
    - task setup

build-macos:
  extends: .build
  tags:
    - macos
    - arm64
  variables:
    # Notary credentials live in the keychain profile; no secrets are passed to
    # notarytool here. Reuses the profile already provisioned for multiviewer.
    APPLE_KEYCHAIN_PROFILE: "multiviewer-notary"
  before_script:
    - !reference [.build, before_script]
    # Setup the signing keychain
    - security unlock-keychain -p "$APPLE_KEYCHAIN_PWD" "$APPLE_KEYCHAIN_NAME"
    - security set-keychain-settings -u "$APPLE_KEYCHAIN_NAME" # Prevents auto-locks
    - security list-keychains -d user -s "$APPLE_KEYCHAIN_NAME" $(security list-keychains -d user | xargs) # Add keychain to user search path
    - > # Authorise codesign and apple tools to use the content of the keychain
      security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PWD" "$APPLE_KEYCHAIN_NAME"
  script:
    - wails3 task release GOOS=darwin GOARCH=amd64 ARCH=amd64 VERSION="${CI_COMMIT_TAG#v}"
    - xcrun stapler validate "dist/${PACKAGE_NAME}-${CI_COMMIT_TAG#v}-darwin-amd64.dmg"
    - wails3 task release GOOS=darwin GOARCH=arm64 ARCH=arm64 VERSION="${CI_COMMIT_TAG#v}"
    - xcrun stapler validate "dist/${PACKAGE_NAME}-${CI_COMMIT_TAG#v}-darwin-arm64.dmg"
  after_script:
    - security lock-keychain "$APPLE_KEYCHAIN_NAME"

build-windows:
  extends: .build-windows
  tags:
    - windows
    - amd64
  script:
    - wails3 task release GOOS=windows GOARCH=amd64 ARCH=amd64 VERSION=$($env:CI_COMMIT_TAG -replace '^v','')
    - wails3 task release GOOS=windows GOARCH=arm64 ARCH=arm64 VERSION=$($env:CI_COMMIT_TAG -replace '^v','')

build-linux-amd64:
  extends: .build-linux
  tags:
    - linux
    - amd64
  script:
    - wails3 task release GOOS=linux GOARCH=amd64 ARCH=amd64 VERSION="${CI_COMMIT_TAG#v}"

build-linux-arm64:
  extends: .build-linux
  tags:
    - linux
    - arm64
  script:
    - wails3 task release GOOS=linux GOARCH=arm64 ARCH=arm64 VERSION="${CI_COMMIT_TAG#v}"


upload:
  stage: release
  image: alpine:3.24.0
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build-macos
      artifacts: true
    - job: build-windows
      artifacts: true
    - job: build-linux-amd64
      artifacts: true
    - job: build-linux-arm64
      artifacts: true
  before_script:
    - apk add --no-cache curl
  script:
    - |
      for archive in dist/*; do
        [ -f "$archive" ] || continue
        filename=$(basename "$archive")
        echo "  -> ${filename}"
        curl --fail --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${archive}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${CI_COMMIT_TAG}/${filename}"
      done

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build-macos
      artifacts: true
    - job: build-windows
      artifacts: true
    - job: build-linux-amd64
      artifacts: true
    - job: build-linux-arm64
      artifacts: true
    - job: upload
      artifacts: false
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git jq
  script:
    # --- Generate changelog from commits since previous tag ---
    - |
      prev_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
      if [ -n "$prev_tag" ]; then
        git log --pretty=format:"- %s" "${prev_tag}"..HEAD > release-description.txt
      else
        echo "Release ${CI_COMMIT_TAG}" > release-description.txt
      fi
    # --- Build release-cli --assets-link flags for installers ---
    - |
      : > release-links.txt
      for archive in dist/*; do
        [ -f "$archive" ] || continue
        filename=$(basename "$archive")
        url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${CI_COMMIT_TAG}/${filename}"
        name_json=$(printf '%s' "$filename" | jq -Rs . | sed 's/^"//;s/"$//')
        url_json=$(printf '%s' "$url" | jq -Rs . | sed 's/^"//;s/"$//')
        echo "--assets-link={\"name\":\"${name_json}\",\"url\":\"${url_json}\"}" >> release-links.txt
      done
    # --- Create the GitLab release using release-cli ---
    - |
      echo "Creating GitLab release ${CI_COMMIT_TAG}..."
      set --
      while IFS= read -r line; do
        set -- "$@" "$line"
      done < release-links.txt
      release-cli create \
        --name="${CI_COMMIT_TAG}" \
        --tag-name="${CI_COMMIT_TAG}" \
        --description="$(cat release-description.txt)" \
        "$@"


pages:
  stage: release
  image:
    name: floryn90/hugo:0.123.8-ext-alpine
    entrypoint: [""]
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest-11 --activate
    - cd ./docs && pnpm install --frozen-lockfile
  script:
    - hugo
  artifacts:
    paths:
      - public
