# ===================================================================
# sACN Monitor — GitLab CI
# Wails v3 Cross-Platform Build & Package Pipeline with GoReleaser
# ===================================================================
# Runners required:
#   - macos  : macOS shell executor (for codesigning .app bundles)
#   - docker : Ubuntu Docker executor (cross-compilation & GoReleaser)
#
# This pipeline uses `wails3 build` and `wails3 package` directly.
# Cross-compilation is handled automatically by the Wails task system.
#
# Architecture note: All non-macOS builds run in a single job on a standard
# golang image. The wails-cross image is built in the prepare stage and is
# launched internally by `wails3 build` when cross-compilation is required.
# macOS builds run in a separate job because they require a macOS runner.
#
# Prerequisites:
#   1. GitLab Container Registry enabled (for the wails-cross image).
#   2. GoReleaser creates the GitLab release using CI_JOB_TOKEN.
#      On GitLab < 16.0 or without 'api' token scope, create a
#      Project Access Token with 'api' scope and set it as GITLAB_TOKEN.
#
# Triggers: Git tags only (build + release). Docs deploy on main.
# ===================================================================

stages:
  - prepare
  - build
  - release

variables:
  PROJECT_NAME: "sACN Monitor"
  PACKAGE_NAME: "sACN-Monitor"
  GO_VERSION: "1.25"
  DOCKER_VERSION: "27.3.1"
  # Prevent Node OOM during frontend build
  NODE_OPTIONS: "--max-old-space-size=4096"
  # Container Registry path for the cross-compilation image
  WAILS_CROSS_IMAGE: "${CI_REGISTRY_IMAGE}/wails-cross:latest"
  # Container Registry path for the CI build environment image
  CI_BUILD_IMAGE: "${CI_REGISTRY_IMAGE}/builder:latest"

# ===================================================================
# PREPARE
# ===================================================================

# Build the wails-cross Docker image once and push it to the project
# Container Registry so that `wails3 build` can launch it internally.
build-wails-cross-image:
  stage: prepare
  tags:
    - shell
    - linux
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    # Pull existing image to prime layer cache (no-op if absent)
    - docker pull ${WAILS_CROSS_IMAGE} || true
    - docker build --cache-from ${WAILS_CROSS_IMAGE} -t ${WAILS_CROSS_IMAGE} -f build/docker/Dockerfile.cross .
    - docker push ${WAILS_CROSS_IMAGE}

# Build the CI environment image containing all host-side build tools.
# This avoids reinstalling dependencies on every pipeline run.
build-ci-image:
  stage: prepare
  tags:
    - shell
    - linux
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker pull ${CI_BUILD_IMAGE} || true
    - docker build --cache-from ${CI_BUILD_IMAGE} --build-arg DOCKER_VERSION=${DOCKER_VERSION} -t ${CI_BUILD_IMAGE} -f build/docker/Dockerfile.ci .
    - docker push ${CI_BUILD_IMAGE}

# ===================================================================
# BUILD + PACKAGE: Windows & Linux (single job, CI build image)
# ===================================================================
# All four targets build in one job so that frontend deps, bindings,
# and icons are built only once. Task's timestamp-based dependency
# caching skips the shared steps after the first build.
#
# The job runs in the pre-built CI image. `wails3 build` automatically
# launches the wails-cross Docker image internally when cross-compilation
# is required (Windows targets and Linux arm64 on an amd64 host).
# ===================================================================

build:
  stage: build
  image: ${CI_BUILD_IMAGE}
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: 1
  tags:
    - docker-builder
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build-ci-image
      artifacts: false
    - job: build-wails-cross-image
      artifacts: false
  before_script:
    # Ensure the wails-cross image is available in the Docker daemon
    # for wails3 build's internal docker usage.
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker pull ${WAILS_CROSS_IMAGE} || true
    - docker tag ${WAILS_CROSS_IMAGE} wails-cross
  script:
    # --- Linux amd64 ---
    - wails3 task linux:build:docker GOOS=linux GOARCH=amd64
    - wails3 package GOOS=linux GOARCH=amd64
    - mkdir -p bin/linux-amd64
    - cp "bin/${PROJECT_NAME}" "bin/linux-amd64/sACN Monitor" 2>/dev/null || cp "bin/${PROJECT_NAME}-linux-amd64" "bin/linux-amd64/sACN Monitor" 2>/dev/null || true
    - mv bin/*.deb "bin/linux-amd64/" 2>/dev/null || true
    - mv bin/*.rpm "bin/linux-amd64/" 2>/dev/null || true
    - mv bin/*.AppImage "bin/linux-amd64/" 2>/dev/null || true
    - mv bin/*.pkg.tar.zst "bin/linux-amd64/" 2>/dev/null || true

    # --- Linux arm64 ---
    - wails3 task linux:build:docker GOOS=linux GOARCH=arm64
    - wails3 package GOOS=linux GOARCH=arm64
    - mkdir -p bin/linux-arm64
    - cp "bin/${PROJECT_NAME}" "bin/linux-arm64/sACN Monitor" 2>/dev/null || cp "bin/${PROJECT_NAME}-linux-arm64" "bin/linux-arm64/sACN Monitor" 2>/dev/null || true
    - mv bin/*.deb "bin/linux-arm64/" 2>/dev/null || true
    - mv bin/*.rpm "bin/linux-arm64/" 2>/dev/null || true
    - mv bin/*.AppImage "bin/linux-arm64/" 2>/dev/null || true
    - mv bin/*.pkg.tar.zst "bin/linux-arm64/" 2>/dev/null || true

    # --- Darwin amd64 ---
    - wails3 build GOOS=darwin GOARCH=amd64
    - wails3 package GOOS=darwin GOARCH=amd64
    - mkdir -p bin/darwin-amd64
    - cp "bin/${PROJECT_NAME}" "bin/darwin-amd64/sACN Monitor"
    - tar -czf "bin/darwin-amd64/${PACKAGE_NAME}-darwin-amd64.app.tar.gz" -C bin "${PROJECT_NAME}.app"

    # --- Darwin arm64 ---
    - wails3 build GOOS=darwin GOARCH=arm64
    - wails3 package GOOS=darwin GOARCH=arm64
    - mkdir -p bin/darwin-arm64
    - cp "bin/${PROJECT_NAME}" "bin/darwin-arm64/sACN Monitor"
    - tar -czf "bin/darwin-arm64/${PACKAGE_NAME}-darwin-arm64.app.tar.gz" -C bin "${PROJECT_NAME}.app"

    # --- Windows amd64 ---
    - wails3 build GOOS=windows GOARCH=amd64
    - wails3 package GOOS=windows GOARCH=amd64
    - mkdir -p bin/windows-amd64
    - cp "bin/${PROJECT_NAME}.exe" "bin/windows-amd64/sACN Monitor.exe" 2>/dev/null || cp "bin/${PROJECT_NAME}-windows-amd64.exe" "bin/windows-amd64/sACN Monitor.exe" 2>/dev/null || true
    - mv "bin/${PROJECT_NAME}-amd64-installer.exe" "bin/windows-amd64/${PACKAGE_NAME}-windows-amd64-installer.exe" 2>/dev/null || true

    # --- Windows arm64 ---
    - wails3 build GOOS=windows GOARCH=arm64
    - wails3 package GOOS=windows GOARCH=arm64
    - mkdir -p bin/windows-arm64
    - cp "bin/${PROJECT_NAME}.exe" "bin/windows-arm64/sACN Monitor.exe" 2>/dev/null || cp "bin/${PROJECT_NAME}-windows-arm64.exe" "bin/windows-arm64/sACN Monitor.exe" 2>/dev/null || true
    - mv "bin/${PROJECT_NAME}-arm64-installer.exe" "bin/windows-arm64/${PACKAGE_NAME}-windows-arm64-installer.exe" 2>/dev/null || true

  artifacts:
    paths:
      - bin/windows-amd64/
      - bin/windows-arm64/
      - bin/linux-amd64/
      - bin/linux-arm64/
      - bin/darwin-amd64/
      - bin/darwin-arm64/
    expire_in: 1 day



# ===================================================================
# RELEASE: GoReleaser packages binaries and creates GitLab release
# ===================================================================

release:
  stage: release
  image:
    name: goreleaser/goreleaser:v2.8.1
    entrypoint: [""]
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build
      artifacts: true
  variables:
    GITLAB_TOKEN: $CI_JOB_TOKEN
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - goreleaser release --clean

# ===================================================================
# PAGES: Documentation (Hugo site)
# ===================================================================

pages:
  stage: release
  image:
    name: floryn90/hugo:0.123.8-ext-alpine
    entrypoint: [""]
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest-11 --activate
    - cd ./docs && pnpm install --frozen-lockfile
  script:
    - hugo
  artifacts:
    paths:
      - public
