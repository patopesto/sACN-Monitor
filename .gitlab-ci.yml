# ===================================================================
# sACN Monitor — GitLab CI
# Wails v3 Cross-Platform Build & Package Pipeline with GoReleaser
# ===================================================================
# Runners required:
#   - macos  : macOS shell executor (for codesigning .app bundles)
#   - docker : Ubuntu Docker executor (cross-compilation & GoReleaser)
#
# This pipeline uses `wails3 build` and `wails3 package` directly.
# Cross-compilation is handled automatically by the Wails task system.
#
# Prerequisites:
#   1. GitLab Container Registry enabled (for the wails-cross image).
#   2. GoReleaser creates the GitLab release using CI_JOB_TOKEN.
#      On GitLab < 16.0 or without 'api' token scope, create a
#      Project Access Token with 'api' scope and set it as GITLAB_TOKEN.
#
# Triggers: Git tags only (build + release). Docs deploy on main.
# ===================================================================

stages:
  - prepare
  - build
  - release

variables:
  PROJECT_NAME: "sACN Monitor"
  PACKAGE_NAME: "sACN-Monitor"
  GO_VERSION: "1.25.0"
  # Full git history is required by GoReleaser for changelog generation
  GIT_DEPTH: 0
  # Prevent Node OOM during frontend build
  NODE_OPTIONS: "--max-old-space-size=4096"
  # Container Registry path for the cross-compilation image
  WAILS_CROSS_IMAGE: "${CI_REGISTRY_IMAGE}/wails-cross:latest"

# ===================================================================
# PREPARE
# ===================================================================

# Build the wails-cross Docker image once and push it to the project
# Container Registry so subsequent build jobs can pull it quickly.
build-wails-cross-image:
  stage: prepare
  tags:
    - shell
    - linux
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker build -t ${WAILS_CROSS_IMAGE} -f build/docker/Dockerfile.cross .
    - docker push ${WAILS_CROSS_IMAGE}

# ===================================================================
# BUILD + PACKAGE: Windows & Linux (Docker runner)
# ===================================================================
# Each job runs `wails3 build` then `wails3 package` for one platform.
# `wails3 build` handles frontend deps, bindings, icons and compilation.
# `wails3 package` creates platform-specific installers/packages.
# ===================================================================

.build:
  stage: build
  image: golang:${GO_VERSION}-bookworm
  tags:
    - docker-builder
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build-wails-cross-image
      artifacts: false
  before_script:
    # Install tools needed on the host: Node.js (frontend), NSIS (Windows), Docker CLI
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl nodejs pnpm git nsis
    # Install Wails v3 CLI and nfpm (Linux packaging)
    - go install github.com/wailsapp/wails/v3/cmd/wails3@latest
    - go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
    # Pull the cross-compilation image so wails3 build can find it locally
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    - docker pull ${WAILS_CROSS_IMAGE}
    - docker tag ${WAILS_CROSS_IMAGE} wails-cross
  script:
    - wails3 build GOOS=${GOOS} GOARCH=${GOARCH}
    - wails3 package GOOS=${GOOS} GOARCH=${GOARCH}
    - |
      mkdir -p "bin/${GOOS}-${GOARCH}"
      EXT=""
      [ "${GOOS}" = "windows" ] && EXT=".exe"
      # Normalize raw binary path for GoReleaser
      if [ -f "bin/${PROJECT_NAME}${EXT}" ]; then
        cp "bin/${PROJECT_NAME}${EXT}" "bin/${GOOS}-${GOARCH}/${BINARY_NAME}"
      elif [ -f "bin/${PROJECT_NAME}-${GOOS}-${GOARCH}${EXT}" ]; then
        cp "bin/${PROJECT_NAME}-${GOOS}-${GOARCH}${EXT}" "bin/${GOOS}-${GOARCH}/${BINARY_NAME}"
      fi
      # Normalize platform packages
      if [ "${GOOS}" = "windows" ]; then
        mv "bin/${PROJECT_NAME}-${GOARCH}-installer.exe" "bin/${GOOS}-${GOARCH}/${PACKAGE_NAME}-${GOOS}-${GOARCH}-installer.exe" 2>/dev/null || true
      elif [ "${GOOS}" = "linux" ]; then
        mv bin/*.deb "bin/${GOOS}-${GOARCH}/" 2>/dev/null || true
        mv bin/*.rpm "bin/${GOOS}-${GOARCH}/" 2>/dev/null || true
        mv bin/*.AppImage "bin/${GOOS}-${GOARCH}/" 2>/dev/null || true
        mv bin/*.pkg.tar.zst "bin/${GOOS}-${GOARCH}/" 2>/dev/null || true
      fi
  artifacts:
    paths:
      - bin/${GOOS}-${GOARCH}/
    expire_in: 1 day

build-windows-amd64:
  extends: .build
  variables:
    GOOS: windows
    GOARCH: amd64
    BINARY_NAME: "sACN Monitor.exe"

build-windows-arm64:
  extends: .build
  variables:
    GOOS: windows
    GOARCH: arm64
    BINARY_NAME: "sACN Monitor.exe"

build-linux-amd64:
  extends: .build
  variables:
    GOOS: linux
    GOARCH: amd64
    BINARY_NAME: "sACN Monitor"

build-linux-arm64:
  extends: .build
  variables:
    GOOS: linux
    GOARCH: arm64
    BINARY_NAME: "sACN Monitor"

# ===================================================================
# BUILD + PACKAGE: macOS (macOS runner)
# ===================================================================
# macOS jobs run natively on a macOS shell executor. `wails3 package`
# depends on `build`, so running `wails3 package` alone builds and
# packages the .app bundle, then we codesign and tar it.
# ===================================================================

.build-darwin:
  stage: build
  tags:
    - macos
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - export PATH="$HOME/go/bin:/usr/local/go/bin:$PATH"
    - go install github.com/wailsapp/wails/v3/cmd/wails3@latest
  script:
    - wails3 build GOOS=darwin GOARCH=${GOARCH}
    - wails3 package GOOS=darwin GOARCH=${GOARCH}
    - |
      mkdir -p "bin/darwin-${GOARCH}"
      cp "bin/${PROJECT_NAME}" "bin/darwin-${GOARCH}/${PROJECT_NAME}"
      tar -czf "bin/darwin-${GOARCH}/${PACKAGE_NAME}-darwin-${GOARCH}.app.tar.gz" -C bin "${PROJECT_NAME}.app"
  artifacts:
    paths:
      - bin/darwin-${GOARCH}/
    expire_in: 1 day

build-darwin-amd64:
  extends: .build-darwin
  variables:
    GOARCH: amd64

build-darwin-arm64:
  extends: .build-darwin
  variables:
    GOARCH: arm64

# ===================================================================
# RELEASE: GoReleaser packages binaries and creates GitLab release
# ===================================================================

release:
  stage: release
  image:
    name: goreleaser/goreleaser:v2.8.1
    entrypoint: [""]
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build-windows-amd64
      artifacts: true
    - job: build-windows-arm64
      artifacts: true
    - job: build-linux-amd64
      artifacts: true
    - job: build-linux-arm64
      artifacts: true
    - job: build-darwin-amd64
      artifacts: true
    - job: build-darwin-arm64
      artifacts: true
  variables:
    GITLAB_TOKEN: $CI_JOB_TOKEN
    GIT_STRATEGY: clone
  before_script:
    - apk add --no-cache git 2>/dev/null || apt-get update && apt-get install -y git 2>/dev/null || true
    - git fetch --unshallow || true
    - git fetch --tags origin || true
  script:
    - goreleaser release --clean

# ===================================================================
# PAGES: Documentation (Hugo site)
# ===================================================================

pages:
  stage: release
  image:
    name: floryn90/hugo:0.123.8-ext-alpine
    entrypoint: [""]
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest-11 --activate
    - cd ./docs && pnpm install --frozen-lockfile
  script:
    - hugo
  artifacts:
    paths:
      - public
