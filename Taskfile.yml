version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  frontend: ./frontend/Taskfile.yml

vars:
  APP_NAME: "sACN Monitor"
  BIN_DIR: "bin"
  PACKAGE_NAME: "sACN-Monitor"
  RELEASE_DIR: "dist"
  APP_VERSION: "1.5.0"
  VERSION: '{{.VERSION | default .APP_VERSION}}'
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "pnpm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  PNPM_VERSION: "12"
  WAILS_VERSION: "v3.1.0"
  GOOS: '{{.GOOS | default OS}}'

tasks:
  setup:
    desc: Install the build dependencies for the current platform
    cmds:
      - task: '{{OS}}:setup'

  # Wails tasks
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker

  # Custom tasks
  build:generator:
    summary: Build the generate_dmx script
    sources:
      - ./scripts/**/*.go
    cmd: go build -o {{.BIN_DIR}}/generate_dmx scripts/generate_dmx.go

  run:generator:
    summary: Run the generate_dmx script
    watch: true
    cmds:
      - task: build:generator
      - ./{{.BIN_DIR}}/generate_dmx {{.CLI_ARGS}}

  version:set:
    desc: Set the app version in Taskfile.yml and all build assets
    platforms: [darwin, linux]
    silent: true
    vars:
      NEW_VERSION: '{{.VERSION | default .APP_VERSION}}'
    cmds:
      - |
        set -eu
        new="{{.NEW_VERSION}}"
        new="${new#v}"
        if ! printf '%s\n' "$new" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$'; then
          echo "Invalid version: $new (expected x.y.z)"
          exit 1
        fi
        old="{{.APP_VERSION}}"
        # Token boundaries keep 2.0.0 from rewriting 12.0.0 (LSMinimumSystemVersion).
        escaped=$(printf '%s' "$old" | sed 's/\./\\./g; s/\+/\\+/g')
        sed -E -i.bak "s/^  APP_VERSION: \"$escaped\"$/  APP_VERSION: \"$new\"/" Taskfile.yml
        rm -f Taskfile.yml.bak
        for file in \
          build/config.yml \
          build/darwin/Info.plist \
          build/darwin/Info.dev.plist \
          build/ios/Info.plist \
          build/ios/Info.dev.plist \
          build/ios/build.sh \
          build/linux/nfpm/nfpm.yaml \
          build/windows/info.json \
          build/windows/nsis/wails_tools.nsh \
          build/windows/wails.exe.manifest; do
          sed -E -i.bak "s/(^|[^0-9A-Za-z.+-])$escaped(-dev)?([^0-9A-Za-z.+-]|$)/\1$new\2\3/g" "$file"
          rm -f "$file.bak"
        done
        echo "Updated app version: $old -> $new"
      - task: version:check
        vars:
          EXPECTED_VERSION: '{{.NEW_VERSION | default .APP_VERSION}}'

  version:check:
    desc: Verify versions are consistent
    platforms: [darwin, linux]
    silent: true
    vars:
      EXPECTED_VERSION: '{{.EXPECTED_VERSION | default .VERSION}}'
    cmds:
      - |
        set -eu
        version="{{.EXPECTED_VERSION}}"
        version="${version#v}"
        if [ -z "$version" ]; then
          echo "APP_VERSION is empty"
          exit 1
        fi
        # Token boundaries keep 2.0.0 from matching 12.0.0 (LSMinimumSystemVersion).
        escaped=$(printf '%s' "$version" | sed 's/\./\\./g; s/\+/\\+/g')
        fail=0
        source_version=$(sed -n 's/^  APP_VERSION: "\([^"]*\)"$/\1/p' Taskfile.yml)
        if [ "$source_version" != "$version" ]; then
          echo "Mismatch: Taskfile.yml APP_VERSION=$source_version, expected $version"
          fail=1
        fi
        check() {
          file=$1
          want=$2
          actual=$(grep -E -c "(^|[^0-9A-Za-z.+-])$escaped(-dev)?([^0-9A-Za-z.+-]|$)" "$file" || true)
          if [ "$actual" != "$want" ]; then
            echo "❌ Mismatch: $file has $actual occurrence(s) of $version, expected $want"
            fail=1
          fi
        }
        check build/config.yml 1
        check build/darwin/Info.plist 2
        check build/darwin/Info.dev.plist 2
        check build/ios/Info.plist 2
        check build/ios/Info.dev.plist 2
        check build/ios/build.sh 2
        check build/linux/nfpm/nfpm.yaml 1
        check build/windows/info.json 2
        check build/windows/nsis/wails_tools.nsh 1
        check build/windows/wails.exe.manifest 1
        if [ "$fail" -ne 0 ]; then
          exit 1
        fi
        echo "✅ All build assets at version $version"

  check:
    desc: Clean, tidy and audit
    cmds:
      - task: fmt
      - task: vet
      - task: common:go:mod:tidy
      - go run golang.org/x/vuln/cmd/govulncheck@latest -show verbose ./...
      - task: frontend:check
      - task: version:check

  fmt:
    desc: Run Formatting
    cmd: go fmt ./...

  vet:
    desc: Run linting
    cmd: go vet ./...

  update:
    desc: Update dependencies
    cmds:
      - task: common:go:mod:tidy
      - go get -u ./...
      - task: frontend:update

  clean:
    desc: Clean build directoy
    cmds:
      - rm -rf {{.BIN_DIR}}
      - task: frontend:clean

  release:
    summary: Build and archive a single platform
    vars:
      GOOS: '{{.GOOS | default OS}}'
      GOARCH: '{{.GOARCH | default ARCH}}'
      PLATFORM: '{{.GOOS}}-{{.GOARCH}}'
    cmds:
      - task: version:check
      - task: '{{.GOOS}}:package'
        vars:
          ARCH: '{{.GOARCH}}'
      - task: '{{.GOOS}}:release:collect'
        vars:
          ARCH: '{{.GOARCH}}'
          PLATFORM: '{{.PLATFORM}}'
      - task: 'common:release:archive'
        vars:
          PLATFORM: '{{.PLATFORM}}'
